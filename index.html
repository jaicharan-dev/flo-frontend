<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flo Tracker</title>
    <style>
        :root { --primary: #007AFF; --bg: #F2F2F7; --card: #FFFFFF; --text: #1C1C1E; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: 0 auto; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
        button { background-color: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
        .transaction-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <div id="login-screen" class="card">
        <h2>Welcome to Flo</h2>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Log In</button>
        <p style="font-size: 12px; text-align: center; color: gray;">(Ensure your backend is running!)</p>
    </div>

    <div id="app-screen" class="hidden">

        <div class="card" style="text-align: center;">
            <h1 id="total-spent">₹0.00</h1>
            <p style="margin:0; color: gray;">Spent in last 90 days</p>
        </div>

        <div class="card">
            <h3>Add Expense</h3>
            <input type="number" id="amount" placeholder="Amount (₹)">
            <input type="text" id="desc" placeholder="What did you buy?">
            <select id="category-select">
                <option value="">Connecting to cloud server...</option>
            </select>
            <button onclick="addTransaction()">Save Expense</button>
        </div>

        <div class="card">
            <h3>Recent Transactions</h3>
            <div id="transaction-list"></div>
        </div>
        
        <div class="card">
            <h3>Spending Analytics</h3>
            <canvas id="analytics-chart" width="400" height="400"></canvas>
        </div>

        <button onclick="logout()" style="background-color: #FF3B30;">Log Out</button>
    </div>
</div>

<script>
    // --- SETTINGS ---
    // Change this to your Render URL! (No trailing slash)
    let API_BASE_URL;
    
    // "Am I currently opened on a laptop's local hard drive?"
    if (window.location.hostname === "localhost" || window.location.protocol === "file:") {
        // YES: Connect to the Sandbox (Local uvicorn server)
        API_BASE_URL = "http://localhost:8000"; 
    } else {
        // NO: I must be live on the internet! Connect to the Live Stage (Render)
        API_BASE_URL = "https://flo-api.onrender.com"; 
    }
    
    // --- APP LOGIC ---
    // Check if we are already logged in when the app opens
    window.onload = () => {
        if (localStorage.getItem("token")) {
            showApp();
        }
    };

    async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        // OAuth2 requires form data, not JSON!
        const formData = new URLSearchParams();
        formData.append("username", email);
        formData.append("password", password);

        const response = await fetch(`${API_BASE_URL}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem("token", data.access_token); // Save the wristband!
            showApp();
        } else {
            alert("Login failed! Check credentials.");
        }
    }

    function showApp() {
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("app-screen").classList.remove("hidden");
        fetchCategories();
        fetchAnalytics();
        fetchTransactions();
        fetchChartData();
    }

    async function fetchAnalytics() {
        const token = localStorage.getItem("token");
        const response = await fetch(`${API_BASE_URL}/analytics/rolling-average`, {
            headers: { "Authorization": `Bearer ${token}` }
        }); 
        if (response.ok) {
            const data = await response.json();
            document.getElementById("total-spent").innerText = `₹${data.total_spent_in_window.toFixed(2)}`;
        }
    }

    async function fetchTransactions() {
        const token = localStorage.getItem("token");
        const response = await fetch(`${API_BASE_URL}/transactions/`, {
            headers: { "Authorization": `Bearer ${token}` }
        });
        
        const list = document.getElementById("transaction-list");

        if (response.ok) {
            const transactions = await response.json();
            list.innerHTML = ""; 
            
            // If the database is completely empty
            if (transactions.length === 0) {
                list.innerHTML = "<li style='padding: 10px; color: gray; text-align: center;'>No transactions yet. Start spending!</li>";
                return;
            }

            // FEATURE: .slice(0, 5) grabs only the first 5 items from the array
            transactions.reverse().slice(0, 5).forEach(t => {
                list.innerHTML += `
                    <li style="display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee;">
                        <span>${t.description} <small style="color: gray; display: block; font-size: 12px;">${t.category_name || ''}</small></span>
                        <span style="font-weight: bold;">₹${t.amount}</span>
                    </li>
                `;
            });
        } else {
            // BUG FIX: The Honest UI fallback if the server hiccups
            list.innerHTML = "<li style='padding: 10px; color: gray; text-align: center;'>Loading recent transactions...</li>";
        }
    }

    // Global variable to hold our chart instance
    let spendingChart;

    async function fetchChartData() {
        const token = localStorage.getItem("token");
        const response = await fetch(`${API_BASE_URL}/analytics/summary`, {
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (response.ok) {
            const rawData = await response.json();

            // 1. Transform the raw JSON into two flat arrays for Chart.js
            const chartLabels = rawData.map(item => item.category_name);
            const chartValues = rawData.map(item => item.total_spent);

            // 2. Grab the blank canvas
            const ctx = document.getElementById("analytics-chart").getContext("2d");

            // 3. Destroy the old chart if it exists (so they don't overlap)
            if (spendingChart) {
                spendingChart.destroy();
            }

            // 4. Draw the new Doughnut Chart!
            spendingChart = new Chart(ctx, {
                type: 'doughnut', 
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'Total Spent (₹)',
                        data: chartValues,
                        // Adding some nice default colors
                        backgroundColor: [
                            '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'bottom' } // Puts the labels below the circle
                    }
                }
            });
        }
    }

    async function addTransaction() {
        const token = localStorage.getItem("token");
        const amount = document.getElementById("amount").value;
        const desc = document.getElementById("desc").value;
        const categoryId = document.getElementById("category-select").value;
        
        const payload = {
            amount: parseFloat(amount),
            type: "Expense",
            description: desc,
            transaction_date: new Date().toISOString().split('T')[0],
            category_id: parseInt(categoryId)
        };

        const response = await fetch(`${API_BASE_URL}/transactions/`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            document.getElementById("amount").value = "";
            document.getElementById("desc").value = "";
            fetchAnalytics(); // Refresh the dashboard
            fetchTransactions(); // Refresh the list
            fetchChartData();
        } else {
            alert("Failed to save transaction.");
        }
    }

    async function fetchCategories() {
        const token = localStorage.getItem("token");
        // Remember we kept the prefix, so the URL is /transactions/categories
        const response = await fetch(`${API_BASE_URL}/transactions/categories`, {
            headers: { "Authorization": `Bearer ${token}` }
        });
        
        if (response.ok) {
            const categories = await response.json();
            const select = document.getElementById("category-select");
            select.innerHTML = ""; // Clear the "Loading categories..." text
            
            categories.forEach(cat => {
                // For each category, create an option with its ID as the value and Name as the text
                select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
            });
        } else {
            // IF THE SERVER IS SLEEPING OR LAGGY:
            const select = document.getElementById("category-select");
            select.innerHTML = `<option value="">Waking up server (takes ~50s)...</option>`;
        }
    }

    function logout() {
        localStorage.removeItem("token");
        document.getElementById("login-screen").classList.remove("hidden");
        document.getElementById("app-screen").classList.add("hidden");
    }
</script>
</body>
</html>
